; Disposable TEST-ONLY PJSIP config for #25.
; Credentials below are synthetic fixtures (never production).
; Endpoints: 700 = virtual receptionist, 701 = harness caller,
; 201 = transfer-target extension. PCMU/PCMA + RFC4733 only.

[transport-udp]
type = transport
protocol = udp
bind = 0.0.0.0:5060

[700]
type = endpoint
context = test
disallow = all
allow = ulaw,alaw
dtmf_mode = rfc4733
direct_media = no
rtp_symmetric = yes
force_rport = yes
rewrite_contact = yes
auth = 700-auth
aors = 700

[700-auth]
type = auth
auth_type = userpass
username = 700
password = vr-test-700

[700]
type = aor
max_contacts = 2
remove_existing = yes

[701]
type = endpoint
context = test
disallow = all
allow = ulaw,alaw
dtmf_mode = rfc4733
direct_media = no
rtp_symmetric = yes
force_rport = yes
rewrite_contact = yes
auth = 701-auth
aors = 701

[701-auth]
type = auth
auth_type = userpass
username = 701
password = vr-test-701

[701]
type = aor
max_contacts = 2
remove_existing = yes

; Transfer-target endpoint for #25 (a live UA registers here and
; answers, so the PBX can complete a REFER by bridging to it).
[702]
type = endpoint
