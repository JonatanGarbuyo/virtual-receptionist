; Disposable TEST-ONLY dialplan for #25. Internal test routes only.

[test]
exten => 700,1,NoOp(inbound to receptionist)
 same => n,Dial(PJSIP/700,20)
 same => n,Hangup()

exten => 701,1,NoOp(inbound to harness caller)
 same => n,Dial(PJSIP/701,20)
 same => n,Hangup()

exten => 702,1,NoOp(inbound to transfer-target UA)
 same => n,Dial(PJSIP/702,20)
 same => n,Hangup()

; Transfer target: answers and holds the line so REFER completion
; (adapter -> caller -> 201) is observable end to end.
exten => 201,1,NoOp(transfer target)
 same => n,Answer()
 same => n,Wait(120)
 same => n,Hangup()

; Transfer-timeout target (#26): rings but never answers and never
; fails, so a REFER to it stays without a final NOTIFY until the
; adapter watchdog reports TIMEOUT (deterministic via the short
; sip.transfer_timeout of the transfer harness, never a sleep).
exten => 299,1,NoOp(transfer timeout target)
 same => n,Ringing()
 same => n,Wait(60)
 same => n,Hangup()
